services:
  excalidash:
    # Single combined image: nginx serves the frontend on :80 and proxies
    # /api and /socket.io to the backend running alongside it on :8000.
    image: git.kazecik.com/xkazecik/excalidash:latest
    container_name: excalidash
    # Run an init process (PID 1) that reaps zombies and forwards SIGTERM/SIGINT
    # so both nginx and node shut down gracefully.
    init: true
    ports:
      - "6767:80"
    environment:
      - DATABASE_PROVIDER=sqlite
      # The Prisma CLI reads this during the migration step and has no default
      # of its own, so it must always be set.
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=${AUTH_MODE:-local}
      # Keep disabled by default; only enable when a trusted proxy sanitizes forwarded headers.
      - TRUST_PROXY=false
      # nginx proxy target. Both processes live in this container, so it is
      # loopback rather than a service name.
      - BACKEND_URL=127.0.0.1:8000
      # Optional for single-instance deployments:
      # if unset, the entrypoint auto-generates and persists these in the volume.
      # Recommended to set explicitly for portability and multi-instance setups.
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      # Optional OIDC settings (required for AUTH_MODE=hybrid or oidc_enforced)
      # - OIDC_PROVIDER_NAME=Authentik
      # - OIDC_ISSUER_URL=https://auth.example.com/application/o/excalidash/
      # - OIDC_CLIENT_ID=your-client-id
      # - OIDC_CLIENT_SECRET=your-client-secret
      # - OIDC_REDIRECT_URI=https://excalidash.example.com/api/auth/oidc/callback
      # Optional scheduled SQLite backups (see docs/DEPLOYMENT.md > Backups).
      # BACKUP_SCHEDULE is a 5- or 6-field cron expression; unset disables it.
      # Uncomment these together with the backup-data volume mount below.
      # - BACKUP_SCHEDULE=0 0 4 * * *
      # - BACKUP_DIR=/app/backups
      # - BACKUP_RETENTION_DAYS=14
    volumes:
      - backend-data:/app/prisma
      # Uploaded images, when S3 storage is not configured.
      - uploads-data:/app/uploads
      # Persist scheduled backups outside the container (pairs with BACKUP_DIR).
      # - backup-data:/app/backups
    networks:
      - excalidash-network
    restart: unless-stopped
    healthcheck:
      # Goes through nginx to the backend, so one check covers both processes.
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:80/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Prisma generate plus migrations run before the backend listens.
      start_period: 60s

networks:
  excalidash-network:
    driver: bridge

volumes:
  backend-data:
  uploads-data:
  # Uncomment to persist scheduled backups (see the service above).
  # backup-data:
