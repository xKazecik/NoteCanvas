services:
  excalidash:
    # Single combined image: nginx serves the frontend on :80 and proxies
    # /api and /socket.io to the backend running alongside it on :8000.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excalidash
    # Run an init process (PID 1) that reaps zombies and forwards SIGTERM/SIGINT
    # so both nginx and node shut down gracefully.
    init: true
    ports:
      - "6767:80"
    environment:
      - DATABASE_PROVIDER=sqlite
      # The Prisma CLI reads this during the migration step and has no default
      # of its own, so it must always be set.
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=${AUTH_MODE:-local}
      # Keep disabled by default; only enable when a trusted proxy sanitizes forwarded headers.
      - TRUST_PROXY=false
      # nginx proxy target. Both processes live in this container, so it is
      # loopback rather than a service name.
      - BACKEND_URL=127.0.0.1:8000
      # Optional for single-instance deployments:
      # if unset, the entrypoint auto-generates and persists these in the volume.
      # Recommended to set explicitly for portability and multi-instance setups.
      # - JWT_SECRET=${JWT_SECRET}
      # - CSRF_SECRET=${CSRF_SECRET}
      # # Local OIDC settings for dev compose.
      # # Bring up the provider with: docker compose -f docker-compose.oidc.yml up -d
      # - OIDC_PROVIDER_NAME=Keycloak
      # # Browser-facing issuer URL.
      # - OIDC_ISSUER_URL=http://localhost:8080/realms/excalidash/
      # # Backend-only discovery URL on the shared container network.
      # - OIDC_DISCOVERY_URL=http://keycloak:8080/realms/excalidash/
      # - OIDC_CLIENT_ID=excalidash
      # # Local OIDC test secret; align with oidc/keycloak/realm-excalidash.json.
      # - OIDC_ID_TOKEN_SIGNED_RESPONSE_ALG=RS256
      # - OIDC_CLIENT_SECRET=excalidash-dev-secret
      # - OIDC_REDIRECT_URI=http://localhost:6767/api/auth/oidc/callback
      # - OIDC_SCOPES=openid profile email
      # - OIDC_ADMIN_GROUPS=admins
    volumes:
      - backend-data:/app/prisma
    networks:
      - excalidash-network
    restart: unless-stopped
    healthcheck:
      # Goes through nginx to the backend, so one check covers both processes.
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--output-document=/dev/null",
          "http://127.0.0.1:80/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Prisma generate plus migrations run before the backend listens.
      start_period: 60s

networks:
  excalidash-network:
    driver: bridge

volumes:
  backend-data:

