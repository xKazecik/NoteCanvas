# notecanvas -- single prebuilt image, everything the app needs to run.
#
#   cp .env.example .env      # edit it, at minimum set JWT_SECRET and CSRF_SECRET
#   docker compose -f docker-compose-image.yml up -d
#
# The image bundles nginx (serving the frontend on port 80, proxying /api and
# /socket.io) and the Node backend (loopback :8000) in one container.

services:
  notecanvas:
    image: git.kazecik.com/xkazecik/notecanvas:${NOTECANVAS_TAG:-latest}
    container_name: notecanvas
    # Run an init process (PID 1) that reaps zombies and forwards SIGTERM/SIGINT
    # so nginx and node both shut down gracefully.
    init: true
    ports:
      - "${NOTECANVAS_PORT:-3000}:80"
    env_file:
      - .env
    environment:
      # Fixed by the image layout; overriding these breaks the bundled setup.
      - NODE_ENV=production
      - PORT=8000
      - BACKEND_URL=127.0.0.1:8000
      # The Prisma CLI reads this during the migration step and has no default
      # of its own, so it must always be set. Set DATABASE_URL in .env to
      # override (e.g. a postgresql:// URL).
      - DATABASE_URL=${DATABASE_URL:-file:/app/prisma/dev.db}
    volumes:
      # SQLite database, migrations and the auto-generated JWT/CSRF secrets.
      - notecanvas-data:/app/prisma
      # Uploaded images, when S3 storage is not configured.
      - notecanvas-uploads:/app/uploads
      # Scheduled backups; pairs with BACKUP_DIR=/app/backups in .env.
      - notecanvas-backups:/app/backups
    restart: unless-stopped
    healthcheck:
      # Hits nginx, which only answers once the static bundle is being served.
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  notecanvas-data:
  notecanvas-uploads:
  notecanvas-backups:
